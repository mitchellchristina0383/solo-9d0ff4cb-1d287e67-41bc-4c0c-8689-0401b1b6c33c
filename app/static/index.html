<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日志检索值班台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>日志检索值班台</h1>
    <div class="status" id="status-box" aria-live="polite">索引状态加载中…</div>
  </header>

  <main>
    <section class="card" id="alerts-card">
      <h2>告警 <span class="badge" id="open-alert-badge" hidden>0</span></h2>
      <div class="row">
        <label class="inline-check">
          <input type="checkbox" id="alerts-show-all"> 显示已确认
        </label>
        <span class="hint" id="alerts-hint">达到触发条数时每个窗口只开一条告警。</span>
      </div>
      <ol id="alerts" class="results alerts"></ol>
    </section>

    <section class="card">
      <h2>告警规则</h2>
      <form id="rule-form">
        <div class="rule-grid">
          <label>服务名
            <input name="service" id="rule-service" list="service-list" required maxlength="100" placeholder="例如 auth-api" autocomplete="off">
          </label>
          <label>关键词
            <input name="keyword" id="rule-keyword" required maxlength="500" placeholder="例如 error 或 登录失败" autocomplete="off">
          </label>
          <label>窗口秒数
            <input name="window" id="rule-window" type="number" min="1" max="86400" value="60" required>
          </label>
          <label>触发条数
            <input name="threshold" id="rule-threshold" type="number" min="1" max="100000" value="5" required>
          </label>
          <button type="submit" id="submit-rule">登记规则</button>
        </div>
        <span class="hint" id="rule-hint">每个服务登记一条规则，只统计登记后提交的日志；关键词与检索使用同一匹配规则。</span>
      </form>
      <ol id="rules" class="results"></ol>
    </section>

    <section class="card">
      <h2>录入日志</h2>
      <form id="log-form">
        <label>服务名
          <input name="service" id="log-service" required maxlength="100" placeholder="例如 auth-api" autocomplete="off">
        </label>
        <label>日志正文
          <textarea name="body" id="log-body" required maxlength="20000" rows="4" placeholder="粘贴故障日志…"></textarea>
        </label>
        <div class="row">
          <button type="submit" id="submit-log">写入</button>
          <span class="hint" id="log-hint"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>检索</h2>
      <form id="search-form">
        <div class="search-grid">
          <label>服务名
            <input name="service" id="search-service" list="service-list" placeholder="全部服务" autocomplete="off">
            <datalist id="service-list"></datalist>
          </label>
          <label>关键词
            <input name="q" id="search-q" placeholder="例如 登录失败 timeout" autocomplete="off">
          </label>
          <button type="submit" id="search-button">检索</button>
        </div>
      </form>
      <p class="hint" id="search-meta"></p>
      <ol id="results" class="results"></ol>
    </section>

    <section class="card">
      <h2>索引重建</h2>
      <div class="row">
        <button id="rebuild-button">发起重建</button>
        <span class="hint" id="rebuild-hint">重建期间录入与检索保持可用。</span>
      </div>
      <dl class="details" id="index-details"></dl>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
